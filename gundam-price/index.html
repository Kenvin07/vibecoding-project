<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高达行情</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>高达行情</h1>
    <div class="updated" id="updated-at">数据加载中…</div>
  </header>

  <main>
    <!-- 四种状态由 js/main.js 切换：加载中（骨架屏）/ 成功卡片 / 空 / 错误 -->
    <div id="kit-list"></div>
  </main>

  <footer>
    数据来源：拼多多 / 淘宝 / 闲鱼的价格快照，由作者手动录入，每天更新 1 次；价格为录入时的快照，非实时报价，仅供参考，请以下单时平台实际价格为准。<br>
    「五算」＝日本官方建议零售价 × 汇率（圈内经验值约等于官方价的 0.05），是常用的行情标尺，对冷门限定款不适用。
  </footer>

  <!-- 卡片组件先引，首页逻辑再引（顺序不能反） -->
  <script src="js/components/kit-card.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
